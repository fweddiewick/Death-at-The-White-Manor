<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1160" width="100%" height="100%">
  <defs>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefdf9" />
      <stop offset="45%" stop-color="#f5ede0" />
      <stop offset="100%" stop-color="#ebdcc6" />
    </linearGradient>
  </defs>

  <!-- Parchment Base Background -->
  <rect width="800" height="1160" fill="url(#parchment)" />
  <rect width="800" height="1160" fill="#2b1a0d" opacity="0.03" />

  <!-- Outer Double Framing Border -->
  <rect x="18" y="18" width="764" height="1124" fill="none" stroke="#2c2118" stroke-width="2.5" />
  <rect x="23" y="23" width="754" height="1114" fill="none" stroke="#685641" stroke-width="1" />
  
  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="4" fill="#685641" />
  <circle cx="772" cy="28" r="4" fill="#685641" />
  <circle cx="28" cy="1132" r="4" fill="#685641" />
  <circle cx="772" cy="1132" r="4" fill="#685641" />

  <!-- Header File Numbers -->
  <text x="45" y="52" font-family="'Courier New', Courier, monospace" font-size="12px" fill="#2c2118">Lab. Ref. No. <tspan font-weight="bold" fill="#87110c">836/26</tspan></text>
  <text x="45" y="70" font-family="'Courier New', Courier, monospace" font-size="12px" fill="#2c2118">Case Ref. No. <tspan font-weight="bold">2147/26</tspan></text>

  <!-- Confidential Stamp Top-Right -->
  <rect x="580" y="40" width="175" height="48" rx="2" fill="none" stroke="#87110c" stroke-width="1.8" stroke-dasharray="6 2" opacity="0.9" />
  <text x="667" y="58" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12.5px" font-weight="bold" fill="#87110c" letter-spacing="1">CONFIDENTIAL</text>
  <text x="667" y="72" text-anchor="middle" font-family="'Georgia', serif" font-size="9.5px" font-style="italic" fill="#5a1814">For Official Inquest Only</text>
  <text x="667" y="82" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="8px" fill="#5a1814">SINGAPORE CONSTABULARY</text>

  <!-- Crest & Seal Center -->
  <g transform="translate(365, 30)">
    <circle cx="35" cy="30" r="28" fill="#e2d4bd" stroke="#4a3723" stroke-width="1.5" />
    <path d="M 22 25 L 35 12 L 48 25 L 42 42 L 28 42 Z" fill="#87110c" opacity="0.9" />
    <text x="35" y="32" text-anchor="middle" font-family="'Georgia', serif" font-weight="bold" font-size="15px" fill="#fdfbf5">SGH</text>
    <text x="35" y="52" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="7.5px" font-weight="bold" fill="#2c2118">1926</text>
  </g>

  <!-- Main Laboratory Titles -->
  <text x="400" y="125" text-anchor="middle" font-family="'Georgia', serif" font-weight="bold" font-size="20px" fill="#1b120c" letter-spacing="1.5">SINGAPORE GENERAL HOSPITAL</text>
  <text x="400" y="145" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="13px" fill="#3d2a1b" letter-spacing="2">FORENSIC SCIENCE LABORATORY</text>
  <text x="400" y="161" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5px" fill="#604b39">OUTRAM ROAD, SINGAPORE • STRAITS SETTLEMENTS</text>
  <text x="755" y="125" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11px" fill="#2c2118">Date: <tspan font-weight="bold">17 September 1926</tspan></text>

  <!-- Title Banner Box -->
  <rect x="140" y="174" width="520" height="26" fill="#f0e5cf" stroke="#3b2b1d" stroke-width="1.2" />
  <line x1="145" y1="177" x2="655" y2="177" stroke="#87110c" stroke-width="0.8" />
  <line x1="145" y1="197" x2="655" y2="197" stroke="#87110c" stroke-width="0.8" />
  <text x="400" y="191" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="12.5px" fill="#24140a" letter-spacing="1.2">FORENSIC LABORATORY REPORT — EVIDENCE SLIP</text>

  <!-- Metadata Grid Rows -->
  <g font-family="'Courier New', Courier, monospace" font-size="11.5px">
    <text x="45" y="226" font-weight="bold" fill="#24140a">SUBJECT</text>
    <text x="175" y="226" fill="#24140a">: <tspan font-weight="bold" fill="#87110c">Examination of a Few Bottles of Pills</tspan></text>

    <text x="45" y="246" font-weight="bold" fill="#24140a">ITEM SUBMITTED</text>
    <text x="175" y="246" fill="#24140a">: Four (4) bottles containing tablets / capsules.</text>

    <text x="45" y="266" font-weight="bold" fill="#24140a">RECEIVED FROM</text>
    <text x="175" y="266" fill="#24140a">: Inspector H. A. Pemberton, Criminal Investigation Department.</text>

    <text x="45" y="286" font-weight="bold" fill="#24140a">DATE REC / REP</text>
    <text x="175" y="286" fill="#24140a">: Received: 15 September 1926  |  Reported: 17 September 1926</text>

    <text x="45" y="306" font-weight="bold" fill="#24140a">EXAMINED BY</text>
    <text x="175" y="306" font-weight="bold" fill="#1b381e">: F. C. Standish, F.C.S., F.I.C.</text>

    <text x="45" y="326" font-weight="bold" fill="#24140a">ASSISTED BY</text>
    <text x="175" y="326" fill="#24140a">: A. Lawrence, B.Sc.</text>
  </g>

  <!-- Dividing line -->
  <line x1="45" y1="345" x2="755" y2="345" stroke="#756149" stroke-width="1" stroke-dasharray="4 3" />

  <!-- Section I: Description -->
  <text x="45" y="368" font-family="'Courier New', Courier, monospace" font-size="12px" font-weight="bold" fill="#87110c">I. DESCRIPTION OF ITEM &amp; EXHIBIT INTEGRITY:</text>
  <text x="50" y="412" font-family="'Georgia', serif" font-size="13px" fill="#20150d">Four (4) labelled bottles containing tablets/capsules: Migraine Relief,</text>
<text x="50" y="428" font-family="'Georgia', serif" font-size="13px" fill="#20150d">Cardiac Tonic, Digestive Enzymes, Allergy &amp; Rhinitis Tablets. Sealed</text>
<text x="50" y="444" font-family="'Georgia', serif" font-size="13px" fill="#20150d">manufacturer labels intact.</text>


  <!-- Section II: Laboratory Analysis -->
  <text x="45" y="470" font-family="'Courier New', Courier, monospace" font-size="12px" font-weight="bold" fill="#87110c">II. PHARMACEUTICAL TOXICOLOGY &amp; FORMULATION:</text>
  
    <!-- Table Header -->
    <rect x="45" y="480" width="710" height="24" fill="#2d1c10" stroke="#5a4732" stroke-width="1.2"/>
    <text x="55" y="496" font-family="'Courier New', Courier, monospace" font-size="11.5px" font-weight="bold" fill="#fcf6eb">QUALITATIVE / QUANTITATIVE ASSAY</text>
    <text x="420" y="496" font-family="'Courier New', Courier, monospace" font-size="11.5px" font-weight="bold" fill="#fcf6eb">LABORATORY OBSERVATION / RESULT</text>
  
      <rect x="45" y="504" width="710" height="24" fill="#f7f2e4" stroke="#786349" stroke-width="0.8"/>
      <line x1="410" y1="504" x2="410" y2="528" stroke="#786349" stroke-width="0.8"/>
      <text x="55" y="520" font-family="'Courier New', Courier, monospace" font-size="11px" font-weight="bold" fill="#24170d">Migraine Relief Formulation</text>
      <text x="420" y="520" font-family="'Courier New', Courier, monospace" font-size="11px" font-weight="bold" fill="#1e3e20">Acetylsalicylic Acid, Paracetamol, Caffeine</text>
    
      <rect x="45" y="528" width="710" height="24" fill="#eee5ce" stroke="#786349" stroke-width="0.8"/>
      <line x1="410" y1="528" x2="410" y2="552" stroke="#786349" stroke-width="0.8"/>
      <text x="55" y="544" font-family="'Courier New', Courier, monospace" font-size="11px" font-weight="bold" fill="#24170d">Cardiac Tonic Formulation</text>
      <text x="420" y="544" font-family="'Courier New', Courier, monospace" font-size="11px" font-weight="bold" fill="#1e3e20">Digitalis (Aerials), Strophanthus</text>
    
      <rect x="45" y="552" width="710" height="24" fill="#f7f2e4" stroke="#786349" stroke-width="0.8"/>
      <line x1="410" y1="552" x2="410" y2="576" stroke="#786349" stroke-width="0.8"/>
      <text x="55" y="568" font-family="'Courier New', Courier, monospace" font-size="11px" font-weight="bold" fill="#24170d">Digestive Enzymes Formulation</text>
      <text x="420" y="568" font-family="'Courier New', Courier, monospace" font-size="11px" font-weight="bold" fill="#1e3e20">Pancreatin, Pepsin, Gentian Extract</text>
    
      <rect x="45" y="576" width="710" height="24" fill="#eee5ce" stroke="#786349" stroke-width="0.8"/>
      <line x1="410" y1="576" x2="410" y2="600" stroke="#786349" stroke-width="0.8"/>
      <text x="55" y="592" font-family="'Courier New', Courier, monospace" font-size="11px" font-weight="bold" fill="#24170d">Allergy Tablets Formulation</text>
      <text x="420" y="592" font-family="'Courier New', Courier, monospace" font-size="11px" font-weight="bold" fill="#1e3e20">Chlorpheniramine, Phenylephrine</text>
    
      <rect x="45" y="600" width="710" height="24" fill="#f7f2e4" stroke="#786349" stroke-width="0.8"/>
      <line x1="410" y1="600" x2="410" y2="624" stroke="#786349" stroke-width="0.8"/>
      <text x="55" y="616" font-family="'Courier New', Courier, monospace" font-size="11px" font-weight="bold" fill="#24170d">Purity &amp; Deleterious Agents</text>
      <text x="420" y="616" font-family="'Courier New', Courier, monospace" font-size="11px" font-weight="bold" fill="#1e3e20">Commercial Standards (No Adulterants)</text>
    

  <!-- Section III & IV: Remarks and Conclusion -->
  <text x="45" y="652" font-family="'Courier New', Courier, monospace" font-size="12px" font-weight="bold" fill="#87110c">III. SPECIAL REMARKS &amp; FINDINGS:</text>
<text x="50" y="670" font-family="'Georgia', serif" font-size="12.5px" fill="#20150d">The cardiac tonic contains therapeutic digitalis within normal pharmaceutical</text>
<text x="50" y="686" font-family="'Georgia', serif" font-size="12.5px" fill="#20150d">limits. All preparations are genuine and safe when taken as prescribed.</text>

  <text x="45" y="716" font-family="'Courier New', Courier, monospace" font-size="12px" font-weight="bold" fill="#87110c">IV. CONCLUSION:</text>
<text x="50" y="734" font-family="'Georgia', serif" font-size="12.5px" fill="#20150d">Pills correspond with recognised pharmacopoeial standards. No illicit or</text>
<text x="50" y="750" font-family="'Georgia', serif" font-size="12.5px" fill="#20150d">lethal poison tampering detected in these bottles.</text>


  <!-- Signature Block Right -->
  <g transform="translate(500, 860)">
    <text x="120" y="22" text-anchor="middle" font-family="'Georgia', serif" font-style="italic" font-weight="bold" font-size="20px" fill="#1b381e">F. C. Standish</text>
    <line x1="20" y1="30" x2="220" y2="30" stroke="#332214" stroke-width="1.2" />
    <text x="120" y="46" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5px" font-weight="bold" fill="#24160d">Government Forensic Analyst</text>
    <text x="120" y="58" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9px" fill="#5c4937">Straits Settlements Medical Service</text>
  </g>

  <!-- Red Seal Stamp Left -->
  <g transform="translate(55, 850) rotate(-4)">
    <rect width="180" height="52" rx="3" fill="none" stroke="#87110c" stroke-width="2" stroke-dasharray="7 2" opacity="0.85" />
    <text x="90" y="22" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="11.5px" fill="#87110c" letter-spacing="1">FORENSIC SCIENCE LAB</text>
    <text x="90" y="38" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="9.5px" fill="#87110c">SINGAPORE • 1926</text>
  </g>

  <!-- BOTTOM GRAND SUMMARY BOX -->
  <g transform="translate(45, 945)">
    <!-- Double Border Frame -->
    <rect x="0" y="0" width="710" height="135" fill="#fcf9ee" stroke="#24170d" stroke-width="2.5" />
    <rect x="4" y="4" width="702" height="127" fill="none" stroke="#87110c" stroke-width="1.2" />

    <!-- Corner Brackets -->
    <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#24170d" stroke-width="2" />
    <path d="M 702 16 L 702 8 L 694 8" fill="none" stroke="#24170d" stroke-width="2" />
    <path d="M 8 119 L 8 127 L 16 127" fill="none" stroke="#24170d" stroke-width="2" />
    <path d="M 702 119 L 702 127 L 694 127" fill="none" stroke="#24170d" stroke-width="2" />

    <!-- Summary Title Banner -->
    <text x="355" y="28" text-anchor="middle" font-family="'Georgia', serif" font-weight="bold" font-size="16px" fill="#87110c" letter-spacing="3">SUMMARY:</text>

    <!-- Wrapped Summary Content Lines -->
    <text x="400" y="1001" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12.5px" font-weight="bold" fill="#1b1008" letter-spacing="0.5">THE PILLS ARE SAFE FOR CONSUMPTION AND ARE PROPER MEDICATION</text>
<text x="400" y="1019" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12.5px" font-weight="bold" fill="#1b1008" letter-spacing="0.5">TREATMENT FOR CHRONIC MIGRAINE, HEART HEALTH, GUT HEALTH AND</text>
<text x="400" y="1037" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12.5px" font-weight="bold" fill="#1b1008" letter-spacing="0.5">ALLERGY &amp; RHINITIS.</text>


    <!-- Official Notice Footer -->
    <text x="355" y="125" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9px" font-style="italic" fill="#5e4933">
      N.B. — Official laboratory exhibit certification under the Criminal Procedure Code 1926.
    </text>
  </g>
</svg>